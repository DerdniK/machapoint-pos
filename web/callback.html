<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MachaPoint - Procesando...</title>
</head>
<body>
    <p id="mensaje">Procesando autenticación con Google...</p>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabase = createClient(
            'https://rbhdpforntgwfbuqychm.supabase.co',
            'sb_publishable_niMghnGw3H6wuJbE9eV_fg_E_RrLFXm'
        );

        async function procesarCallback() {
            try {
                // Si la URL contiene un código de intercambio (?code=...)
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');

                if (code) {
                    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                    if (data?.session) {
                        guardarYRedirigir(data.session);
                        return;
                    }
                }

                // Si viene por hash fragment (#access_token=...) o sesión ya persistida
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw sessionError;

                if (session) {
                    guardarYRedirigir(session);
                    return;
                }

                // Fallback: escuchar el evento de cambio de estado de Supabase
                supabase.auth.onAuthStateChange((event, session) => {
                    if (session) {
                        guardarYRedirigir(session);
                    } else if (event === 'SIGNED_OUT') {
                        window.location.href = "/index.html?error=no_session";
                    }
                });

            } catch (err) {
                console.error("Error al procesar callback:", err);
                window.location.href = "/index.html?error=auth_failed";
            }
        }

        function guardarYRedirigir(session) {
            localStorage.setItem("authToken", session.access_token);
            localStorage.setItem("user", JSON.stringify({
                id: session.user.id,
                email: session.user.email,
                nombre: session.user.user_metadata?.full_name || session.user.email
            }));

            document.getElementById("mensaje").textContent = "¡Sesión exitosa! Redirigiendo...";
            window.location.href = "/catalogo.html";
        }

        procesarCallback();
    </script>
</body>
</html>
