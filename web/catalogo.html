<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/catalogo.css">
    <title>MachaPoint - Catalogo</title>
</head>

<body>

    <main class="barra-superior-container">

        <div id="barra-superior">
            <h1>MachaPoint</h1>
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            
            <nav class="nav-menu" id="nav-menu">
                <ul>
                    <li><a href="ventas.html">Ventas</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                    <li><a href="usuarios.html">Usuarios</a></li>
                </ul>
            </nav>
        </div>

        <section class="form-section">
            <h2>Agregar Nuevo Producto</h2>
            <form id="form-crear-producto">
                
                <div class="form-group">
                    <label for="prod-name">Nombre</label>
                    <input type="text" id="prod-name" placeholder="Ej: Poster Chido" required>
                </div>
                
                <div class="form-group">
                    <label for="prod-sku">SKU</label>
                    <input type="text" id="prod-sku" placeholder="Ej: bc-s-pn-gnd" required>
                </div>
                
                <div class="form-group">
                    <label for="prod-price">Precio</label>
                    <input type="number" step="0.01" id="prod-price" placeholder=" de $1-499" required>
                </div>
                
                <div class="form-group">
                    <label for="prod-type">Type Id</label>
                    <select id="prod-type" required>
                        <option value="" disabled selected>Selecciona un tipo</option>
                        <option value="1">Tipo 1 (Poster)</option>
                        <option value="2">Tipo 2 (Pines)</option>
                        <option value="3">Tipo 3 (Stickers)</option>
                        <option value="4">Tipo 4 (Postales)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="prod-img">Url Image</label>
                    <input type="text" id="prod-img" placeholder="https://..." required>
                </div>
                
                <div class="form-group">
                    <button type="submit">Guardar Producto</button>
                </div>
                
            </form>
            <p id="mensaje-creacion"></p>
        </section>

        <div class="contenido">
            <h2>Inventario de productos</h2>

            <div id="mensaje"></div>

            <section id="productos">
                <!-- Los productos se generan mediante JavaScript -->
            </section>
        </div>

    </main>

    <script src="js/catalogo.js"></script>

</body>
</html>
