<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MachaPoint - Catálogo</title>
    <link rel="icon" type="image/png" href="img/logoo.png">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/role.css">
    <link rel="stylesheet" href="styles/catalogo.css">
    <script src="js/role.js"></script>
</head>
<body>

    <header class="mp-header">
        <h1>MachaPoint</h1>
        <nav>
            <ul data-mp-nav></ul>
        </nav>
        <script src="js/icon-map.js" defer></script>
    </header>

    <main class="barra-superior-container">
        <div class="contenido">
            <h2>Buscar productos</h2>

            <div class="buscador-container">
                <input type="search" id="buscador" placeholder="Buscar por nombre o SKU..." autocomplete="off" aria-label="Buscar productos">
            </div>

            <div id="mensaje"></div>

            <section id="productos">
                <!-- Los productos se generan mediante JavaScript -->
            </section>
        </div>
        

    </main>

    <script src="js/api.js"></script>
    <script src="js/catalogo.js"></script>

</body>
</html>
