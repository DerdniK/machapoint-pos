<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/catalogo.css">
    <title>MachaPoint - Catalogo</title>
</head>

<body>

    <main class="barra-superior-container">

        <div id="barra-superior">
            <h1>MachaPoint</h1>
            <!-- // boton hamburguesa -->
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <nav class="nav-menu" id="nav-menu">
                <ul>
                    <!-- <li><a href="index.html">Inicio</a></li> -->
                    <!-- <li><a href="catalogo.html">Catálogo</a></li> -->
                    <li><a href="usuarios.html">Usuarios</a></li>
                    <!-- <li><a href="login.html">Cerrar sesión</a></li> -->
                </ul>
            </nav>
        </div>

        <section class="form-section">
            <h2>Agregar Nuevo Producto</h2>
            <form id="form-crear-producto">
                <input type="text" id="prod-name" placeholder="Nombre" required>
                <input type="text" id="prod-sku" placeholder="SKU (ej: bc-s-pn)" required>
                <input type="number" step="0.01" id="prod-price" placeholder="Precio" required>
                <input type="number" id="prod-type" placeholder="TypeId (ej: 1)" required>
                <input type="text" id="prod-img" placeholder="URL de imagen" required>
                <button type="submit">Guardar Producto</button>
            </form>
            <p id="mensaje-creacion"></p>
        </section>

        <div class="contenido">
            <h2>Inventario de productos</h2>

            <div id="mensaje"></div>

            <section id="productos">
                <!-- Los productos se generan mediante JavaScript -->
            </section>
        </div>

    </main>

    <script src="js/catalogo.js"></script>

</body>
</html>
