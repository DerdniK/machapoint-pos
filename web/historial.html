<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logoo.png">
    <title>MachaPoint - Historial</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/role.css">
    <link rel="stylesheet" href="styles/productos.css">
    <link rel="stylesheet" href="styles/historial.css">
    <!-- Requiere sesión (cualquier rol) -->
    <script src="js/role.js"></script>
</head>
<body>
    <header class="mp-header">
        <h1>MachaPoint</h1>
        <nav>
            <ul data-mp-nav></ul>
        </nav>
        <script src="js/icon-map.js" defer></script>
    </header>
    <main class="pp-container">
        <section class="mp-card">
            <h2 class="mp-card__title">Historial</h2>

            <!-- ========================= -->
            <!-- SECCIONES -->
            <!-- ========================= -->
            <div class="hv-tabs" role="tablist" aria-label="Secciones del historial">
                <button type="button" class="mp-btn pp-btn-secondary activo" role="tab" id="tab-ventas"
                        aria-selected="true" aria-controls="panel-ventas" data-vista="ventas">Ventas</button>
                <button type="button" class="mp-btn pp-btn-secondary" role="tab" id="tab-cortes"
                        aria-selected="false" aria-controls="panel-cortes" data-vista="cortes" tabindex="-1">Cortes Z</button>
            </div>

            <!-- ========================= -->
            <!-- FILTROS (compartidos) -->
            <!-- ========================= -->
            <div class="hv-atajos" role="group" aria-label="Rangos rápidos">
                <button type="button" class="mp-btn pp-btn-secondary" data-rango="dia">1 Día</button>
                <button type="button" class="mp-btn pp-btn-secondary" data-rango="semana">1 Semana</button>
                <button type="button" class="mp-btn pp-btn-secondary" data-rango="mes">1 Mes</button>
            </div>
            <form id="form-filtros" class="hv-filtros" novalidate>
                <div class="mp-field">
                    <label for="fecha-inicio">Fecha inicio</label>
                    <input type="date" id="fecha-inicio" required>
                </div>
                <div class="mp-field">
                    <label for="fecha-fin">Fecha fin</label>
                    <input type="date" id="fecha-fin" required>
                </div>
                <div class="hv-buscar">
                    <button type="submit" class="mp-btn mp-btn--primary" id="btn-buscar">Consultar</button>
                </div>
            </form>
            <p id="mensaje-fechas" class="mp-inline-msg" role="alert"></p>

            <!-- ========================= -->
            <!-- PANEL: VENTAS -->
            <!-- ========================= -->
            <div id="panel-ventas" role="tabpanel" aria-labelledby="tab-ventas">
                <div id="resumen" class="hv-resumen oculto"></div>
                <div id="estado" class="hv-estado" role="status" aria-live="polite"></div>
                <div class="pp-tabla-wrap">
                    <table class="pp-tabla" id="tabla-ventas" aria-busy="false">
                        <thead>
                            <tr>
                                <th scope="col">Venta</th>
                                <th scope="col">Fecha y hora</th>
                                <th scope="col">Turno</th>
                                <th scope="col">Cajero</th>
                                <th scope="col" class="num">Total</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-ventas-body">
                            <!-- Las filas se generan mediante JavaScript -->
                        </tbody>
                    </table>
                </div>
                <div class="pp-actions">
                    <button type="button" class="mp-btn pp-btn-secondary oculto" id="btn-mas">Mostrar más</button>
                </div>
            </div>

            <!-- ========================= -->
            <!-- PANEL: CORTES Z -->
            <!-- ========================= -->
            <div id="panel-cortes" role="tabpanel" aria-labelledby="tab-cortes" hidden>
                <div id="resumen-cortes" class="hv-resumen oculto"></div>
                <div id="estado-cortes" class="hv-estado" role="status" aria-live="polite"></div>
                <div class="pp-tabla-wrap">
                    <table class="pp-tabla" id="tabla-cortes" aria-busy="false">
                        <thead>
                            <tr>
                                <th scope="col">Corte</th>
                                <th scope="col">Turno</th>
                                <th scope="col">Cajero</th>
                                <th scope="col">Apertura</th>
                                <th scope="col">Cierre</th>
                                <th scope="col" class="num">Ventas</th>
                                <th scope="col" class="num">Efectivo contado</th>
                                <th scope="col" class="num">Diferencia</th>
                                <th scope="col"><span class="sr-only">Detalle</span></th>
                            </tr>
                        </thead>
                        <tbody id="tabla-cortes-body">
                            <!-- Las filas se generan mediante JavaScript -->
                        </tbody>
                    </table>
                </div>
                <div class="pp-actions">
                    <button type="button" class="mp-btn pp-btn-secondary oculto" id="btn-mas-cortes">Mostrar más</button>
                </div>
            </div>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/historial.js"></script>
</body>
</html>
