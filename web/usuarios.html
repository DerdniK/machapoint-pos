<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MachaPoint - Gestión de Usuarios</title>
    <link rel="stylesheet" href="styles/usuarios.css">
</head>
<body>
    <header class="navbar">
        <h1>MachaPoint - Administración</h1>
        <div>
            <span id="health-status">Estado del servicio: Consultando...</span>
            <a href="catalogo.html">Ir a Catálogo</a>
        </div>
    </header>

    <main class="container">
        <!-- Registrar Usuario -->
        <section class="card">
            <h3>Registrar Nuevo Usuario</h3>
            <form id="form-register">
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <input type="text" id="reg-firstname" placeholder="Nombre" required>
                <input type="text" id="reg-lastname" placeholder="Apellido" required>
                <input type="number" id="reg-roleid" placeholder="RoleId (ej: 1)" value="1" required>
                <button type="submit">Registrar</button>
            </form>
        </section>

        <!-- Modificar Usuario -->
        <section class="card">
            <h3>Modificar Username</h3>
            <form id="form-update">
                <input type="text" id="upd-userid" placeholder="Userid (UUID)" required>
                <input type="text" id="upd-username" placeholder="Nuevo Username" required>
                <button type="submit">Actualizar</button>
            </form>
        </section>

        <!-- Eliminar Usuario -->
        <section class="card">
            <h3>Eliminar Usuario</h3>
            <form id="form-delete">
                <input type="text" id="del-userid" placeholder="Userid (UUID)" required>
                <button type="submit" class="btn-danger">Eliminar</button>
            </form>
        </section>

        <p id="user-status-msg"></p>
    </main>

    <script src="js/usuarios.js"></script>
</body>
</html>
