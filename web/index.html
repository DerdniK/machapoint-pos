<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/login.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MachaPoint - Login</title>
</head>


<body>

      <!-- pantalla de carga -->
    <div id="loader">
        <img src="img/logo.png" alt="Logo institucional" class="loader-logo">
        <div class="spinner"></div>
    </div>


  <main class="login-card">

    <h1>¡Bienvenido MachaPoint!</h1>
    <p>Inicia sesion 🦝</p>

    <form id="login">
      <div class="input-login">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario">
      </div>
    
      <div class="input-login">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
      </div>
      

     <button type="submit" class="login-button" id="loginButton">
        <span class="btn-text">Iniciar Sesión</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      
      <p id="mensaje"></p>

    </form>

        <div class="divider"><span>o</span></div>

    <a href="google-login.html" class="google-button">
      <img src="img/google-icon.svg" alt="" class="google-icon">
      <span>Continuar con Google</span>
    </a>

  </main>



<script src="js/login.js"></script>

</body>
</html>
