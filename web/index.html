<!DOCTYPE html>
<html lang="es">
  <link rel="icon" type="image/png" href="img/logoo.png">


<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/login.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MachaPoint - Login</title>
</head>


<body>

      <!-- pantalla de carga -->
    <div id="loader">
        <img src="img/logo.png" alt="Logo institucional" class="loader-logo">
        <div class="spinner"></div>
    </div>


  <main class="login-card">

    <h1>¡Bienvenido MachaPoint!</h1>
    <p>Inicia sesion 🦝</p>

    <form id="login">
      <div class="input-login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Ingresa tu username">
      </div>
    
      <div class="input-login">
        <label for="password">Contraseña</label>
        <div class="password-container">
          <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

     <button type="submit" class="login-button" id="loginButton">
        <span class="btn-text">Iniciar Sesión</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      
      <p id="mensaje"></p>

    </form>

        <div class="divider"><span>o</span></div>

    <a href="google-login.html" class="google-button">
      <img src="img/google_icon.png" alt="" class="google-icon">
      <span>Continuar con Google</span>
    </a>

  </main>



<script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
